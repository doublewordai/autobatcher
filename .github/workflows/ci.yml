name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        openai-version: ["latest", "2.0.0"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test,serve]" ty

      - name: Install minimum supported OpenAI SDK
        if: matrix.openai-version != 'latest'
        run: pip install "openai==${{ matrix.openai-version }}"

      - name: Type check
        run: ty check

      - name: Test
        run: pytest tests/ -v

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openai-version: ["locked", "4.104.0"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported OpenAI SDK
        if: matrix.openai-version != 'locked'
        run: npm install --no-save --package-lock=false "openai@${{ matrix.openai-version }}"

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
