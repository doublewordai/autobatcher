name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        openai-version: ["latest", "2.0.0"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[test,serve]" ty==0.0.107

      - name: Install minimum supported OpenAI SDK
        if: matrix.openai-version != 'latest'
        run: pip install "openai==${{ matrix.openai-version }}"

      - name: Type check
        run: ty check

      - name: Test
        run: pytest tests/ -v

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openai-version: ["locked", "4.104.0"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported OpenAI SDK
        if: matrix.openai-version != 'locked'
        run: npm install --no-save --package-lock=false "openai@${{ matrix.openai-version }}"

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
