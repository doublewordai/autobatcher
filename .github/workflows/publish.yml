name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (autobatcher-v* or autobatcher-ts-v*)"
        required: true
        type: string

jobs:
  publish-python:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'autobatcher-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autobatcher
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python/dist

  publish-typescript:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'autobatcher-ts-v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/autobatcher
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted publishing: authenticated by the job's OIDC token against the
      # trusted publisher configured on npmjs.com (repo + this workflow file +
      # the "npm" environment). Provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
